document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ext-underline-offset:3px}\na:hover{color:#E0603A}\nhtml{scroll-behavior:smooth}\ninput[type=range]{accent-color:#6B4FA0}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"position:sticky;top:0;z-index:30;background:#F5EFE3;border-bottom:1.5px solid #D9CFBC;box-shadow:0 2px 10px rgba(30,39,64,.06)\">\n  <div style=\"max-width:1120px;margin:0 auto;padding:10px 20px;box-sizing:border-box;display:flex;align-items:center;gap:10px\">\n    <button sc-camel-on-click=\"{{ pg.prev }}\" aria-label=\"Önceki sayfa\" style=\"flex-shrink:0;font:inherit;font-size:16px;font-weight:700;padding:9px 14px;border-radius:999px;cursor:pointer;border:2px solid #1E2740;background:transparent;color:#1E2740;opacity:{{ pg.prevOp }}\">← Önceki<\u002Fbutton>\n    <div style=\"flex:1 1 auto;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0\">\n      <sc-for list=\"{{ pg.pills }}\" as=\"p\" hint-placeholder-count=\"9\">\n        <button sc-camel-on-click=\"{{ p.onClick }}\" title=\"{{ p.t }}\" style=\"flex-shrink:0;font:inherit;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;padding:8px 12px;border-radius:999px;cursor:pointer;border:1.5px solid {{ p.bd }};background:{{ p.bg }};color:{{ p.color }};white-space:nowrap\">{{ p.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ pg.next }}\" aria-label=\"Sonraki sayfa\" style=\"flex-shrink:0;font:inherit;font-size:16px;font-weight:700;padding:9px 14px;border-radius:999px;cursor:pointer;border:2px solid #1E2740;background:#1E2740;color:#F5EFE3;opacity:{{ pg.nextOp }}\">Sonraki →<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div style=\"max-width:1120px;margin:0 auto;padding:28px 20px 60px;display:flex;flex-direction:column;gap:48px;box-sizing:border-box\">\n\n<sc-if value=\"{{ pg.p1 }}\" hint-placeholder-val=\"{{ true }}\">\n<header style=\"display:flex;flex-direction:column;gap:20px\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline\">\n    <a href=\"../\" style=\"font-size:17px;font-weight:500;text-decoration:none;color:#3A4258\">← Tüm bölümler<\u002Fa>\n    <a href=\"bolum-06-ceyrekler.html\" style=\"font-size:17px;font-weight:500;color:#3A4258\">Önceki ders: Bölüm 6 · Çeyrekler<\u002Fa>\n  <\u002Fdiv>\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#6B6457\">Bölüm 7 · İstatistik ve Raporlama<\u002Fdiv>\n  <h1 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(40px,7vw,80px);line-height:1.02;margin:0;letter-spacing:-.01em;text-wrap:balance\">Dağılımın <span style=\"color:#6B4FA0;font-style:italic\">biçimi<\u002Fspan> ve standart puan<\u002Fh1>\n  <p style=\"font-size:20px;line-height:1.55;max-width:680px;margin:0;color:#3A4258;text-wrap:pretty\">Verinin şekline bak, bir değerin ortalamadan kaç standart sapma uzakta olduğunu bul ve rapordaki yanlış cümleyi yakala. Her konu ayrı bir sayfada; üstteki ve alttaki düğmelerle ilerle.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px;margin-top:6px\">\n    <sc-for list=\"{{ pg.toc }}\" as=\"t\" hint-placeholder-count=\"9\">\n      <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"font:inherit;display:flex;gap:12px;align-items:baseline;text-align:left;padding:12px 14px;border-radius:14px;cursor:pointer;border:1.5px solid #D9CFBC;background:#FFFBF3;color:#1E2740\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:#E0603A\">{{ t.n }}<\u002Fspan><span style=\"font-size:18px;font-weight:700\">{{ t.t }}<\u002Fspan><\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fheader>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ pg.p1 }}\" hint-placeholder-val=\"{{ true }}\">\n<section id=\"s1\" data-screen-label=\"01 Dağılımın şekli\" style=\"display:flex;flex-direction:column;gap:24px;scroll-margin-top:16px\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#E0603A;font-weight:700\">01<\u002Fspan>\n    <h2 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(30px,4vw,46px);margin:0;line-height:1.1\">Dağılımın bir şekli var<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"background:#1E2740;color:#F5EFE3;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n    <div style=\"font-size:21px;font-weight:700;line-height:1.45;text-wrap:pretty\">Bir kafede 10 kişi oturuyor; ortalama aylık gelirleri 30.000 TL. Kapıdan dünyanın en zengin insanlarından biri giriyor. Ortalama gelir ne olur? Ortanca?<\u002Fdiv>\n    <div style=\"font-size:16px;color:#C9C2B3\">Uydurma bir örnek, ama istatistikte çok bilinen bir düşünce deneyi.<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n      <sc-for list=\"{{ cafe.opts }}\" as=\"o\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.color }}\">{{ o.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ cafe.done }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <p style=\"margin:0;font-size:19px;line-height:1.6;color:#E7E1D4;text-wrap:pretty\"><b style=\"color:{{ cafe.tagColor }}\">{{ cafe.tag }}<\u002Fb> Zengin kişinin aylık geliri 100 milyon TL olsun. Ortalama bu tek kişiyle <b>milyonlara fırlar<\u002Fb>. Ortanca ise sıralamada ortadaki kişiye bakar; o kişi neredeyse hiç değişmez.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          <sc-for list=\"{{ cafe.people }}\" as=\"p\" hint-placeholder-count=\"10\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;padding:6px 10px;border-radius:8px;background:{{ p.bg }};color:{{ p.color }}\">{{ p.t }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px\">\n          <div style=\"background:#2B3553;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px\">\n            <div style=\"font-size:17px;color:#F4A48A;font-weight:700\">Ortalama<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:clamp(28px,4vw,40px);font-weight:700\">{{ cafe.mean }} TL<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#2B3553;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px\">\n            <div style=\"font-size:17px;color:#7FD8CB;font-weight:700\">Ortanca<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:clamp(28px,4vw,40px);font-weight:700\">{{ cafe.med }} TL<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ cafe.toggle }}\" style=\"align-self:flex-start;font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid #F5EFE3;background:#F5EFE3;color:#1E2740\">{{ cafe.btn }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ cafe.restart }}\" style=\"align-self:flex-start;font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid #F5EFE3;background:transparent;color:#F5EFE3\">↺ Soruyu baştan sor<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:32px;margin:12px 0 0;line-height:1.15\">Histogram: verinin fotoğrafı<\u002Fh3>\n  <p style=\"font-size:19px;line-height:1.6;max-width:780px;margin:0;color:#3A4258;text-wrap:pretty\">Yatay eksen <b>eşit genişlikte<\u002Fb> aralıklara bölünür (90–99, 100–109 …). Her sütunun yüksekliği o aralıkta <b>kaç kişi<\u002Fb> olduğunu gösterir. Sütunlar <b>bitişiktir<\u002Fb>: değişken süreklidir, 99 ile 100 arasında boşluk yoktur. Sütun grafiğinden farkı budur.<\u002Fp>\n  <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        <sc-for list=\"{{ hist.tabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n          <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"font:inherit;font-size:17px;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer;border:2px solid #1E2740;background:{{ t.bg }};color:{{ t.color }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ hist.openData }}\" style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;background:#EFE6D3;color:#5A4A2E;padding:6px 12px;border-radius:8px;border:none;cursor:pointer;text-align:left\" style-hover=\"background:#E6DAC2\">Dummy (kurgusal) veriler — 100 hasta · Verileri gör ▸<\u002Fbutton>\n    <\u002Fdiv>\n    <svg sc-camel-view-box=\"0 0 760 335\" style=\"width:100%;height:auto;display:block\">\n      <sc-for list=\"{{ hist.grid }}\" as=\"g\" hint-placeholder-count=\"0\">\n        <line x1=\"70\" x2=\"730\" y1=\"{{ g.y }}\" y2=\"{{ g.y }}\" stroke=\"#E6DDCB\"><\u002Fline>\n        {{ g.el }}\n      <\u002Fsc-for>\n      <sc-for list=\"{{ hist.bars }}\" as=\"b\" hint-placeholder-count=\"0\">\n        <rect x=\"{{ b.x }}\" y=\"{{ b.y }}\" width=\"{{ b.w }}\" height=\"{{ b.h }}\" fill=\"{{ b.fill }}\" fill-opacity=\".85\" stroke=\"#FFFBF3\" stroke-width=\"1.5\"><\u002Frect>\n        {{ b.el }}\n      <\u002Fsc-for>\n      <line x1=\"70\" x2=\"730\" y1=\"300\" y2=\"300\" stroke=\"#1E2740\" stroke-width=\"1.5\"><\u002Fline>\n      <sc-for list=\"{{ hist.ticks }}\" as=\"t\" hint-placeholder-count=\"0\">\n        <line x1=\"{{ t.x }}\" x2=\"{{ t.x }}\" y1=\"300\" y2=\"306\" stroke=\"#1E2740\"><\u002Fline>\n        {{ t.el }}\n      <\u002Fsc-for>\n      <line x1=\"{{ hist.mx }}\" x2=\"{{ hist.mx }}\" y1=\"30\" y2=\"300\" stroke=\"#E0603A\" stroke-width=\"3.5\"><\u002Fline>\n      <line x1=\"{{ hist.dx }}\" x2=\"{{ hist.dx }}\" y1=\"30\" y2=\"300\" stroke=\"#12857A\" stroke-width=\"3.5\" stroke-dasharray=\"7 5\"><\u002Fline>\n      {{ hist.labels }}\n    <\u002Fsvg>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px 24px;font-size:17px;align-items:center\">\n      <span style=\"font-weight:700\">{{ hist.name }}<\u002Fspan>\n      <span style=\"display:flex;gap:8px;align-items:center\"><span style=\"width:24px;height:4px;background:#E0603A\"><\u002Fspan>ortalama<\u002Fspan>\n      <span style=\"display:flex;gap:8px;align-items:center\"><span style=\"width:24px;height:0;border-top:4px dashed #12857A\"><\u002Fspan>ortanca<\u002Fspan>\n      <span style=\"color:#6B6457\">dikey eksen: hasta sayısı<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:19px;line-height:1.6;text-wrap:pretty;background:#F5EFE3;border-radius:12px;padding:14px 16px\">{{ hist.note }}<\u002Fp>\n    <button sc-camel-on-click=\"{{ hist.toggleData }}\" style=\"align-self:flex-start;font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid #1E2740;background:{{ hist.dBg }};color:{{ hist.dColor }}\">{{ hist.dBtn }}<\u002Fbutton>\n    <sc-if value=\"{{ hist.showData }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px 18px;font-size:16px\">\n          <sc-for list=\"{{ hist.dLegend }}\" as=\"l\" hint-placeholder-count=\"0\"><span style=\"display:flex;gap:8px;align-items:center\"><span style=\"width:18px;height:18px;border-radius:4px;background:{{ l.bg }};border:1px solid #D9CFBC\"><\u002Fspan>{{ l.t }}<\u002Fspan><\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;font-size:17px\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:8px;padding:8px 6px;border-bottom:2px solid #1E2740;font-weight:700;font-size:16px\"><span>Aralık<\u002Fspan><span>Hasta<\u002Fspan><span>Yüzde<\u002Fspan><span>Birikimli<\u002Fspan><\u002Fdiv>\n          <sc-for list=\"{{ hist.dRows }}\" as=\"r\" hint-placeholder-count=\"0\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:8px;padding:7px 6px;border-bottom:1px solid #E6DDCB;font-family:'JetBrains Mono',monospace;background:{{ r.bg }}\"><span>{{ r.c0 }}<\u002Fspan><b>{{ r.c1 }}<\u002Fb><span>{{ r.c2 }}<\u002Fspan><span>{{ r.c3 }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:18px;line-height:1.55;color:#3A4258;text-wrap:pretty\">{{ hist.dNote }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px\">\n    <sc-for list=\"{{ shapes }}\" as=\"s\" hint-placeholder-count=\"3\">\n      <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;letter-spacing:.08em;color:#6B4FA0\">{{ s.title }}<\u002Fdiv>\n        {{ s.svg }}\n        <div style=\"font-size:19px;font-weight:700\">{{ s.rule }}<\u002Fdiv>\n        <div style=\"font-size:18px;line-height:1.5;color:#3A4258\">{{ s.text }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"background:#6B4FA0;color:#FFFFFF;border-radius:18px;padding:22px 24px;font-family:'DM Serif Display',serif;font-size:clamp(26px,3.4vw,38px);line-height:1.2;text-align:center\">Akılda kalsın: kuyruk ortalamayı kendine çeker.<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ pg.p2 }}\" hint-placeholder-val=\"{{ true }}\">\n<section id=\"s2\" data-screen-label=\"02 Çarpıklık\" style=\"display:flex;flex-direction:column;gap:24px;scroll-margin-top:16px\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#E0603A;font-weight:700\">02<\u002Fspan>\n    <h2 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(30px,4vw,46px);margin:0;line-height:1.1\">Çarpıklık: kuyruğu sürükle<\u002Fh2>\n  <\u002Fdiv>\n  <p style=\"font-size:19px;line-height:1.6;max-width:780px;margin:0;color:#3A4258;text-wrap:pretty\">10 hastanın hastanede yatış süresi. Her yuvarlak bir hasta, içindeki sayı kaç gün yattığı. <b>Yuvarlakları sağa sola sürükle<\u002Fb>: ortalama, ortanca ve çarpıklık sayısı nasıl değişiyor?<\u002Fp>\n  <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px\">\n    <button sc-camel-on-click=\"{{ dmo.yatis }}\" style=\"align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;background:#EFE6D3;color:#5A4A2E;padding:6px 12px;border-radius:8px;border:none;cursor:pointer;text-align:left\" style-hover=\"background:#E6DAC2\">Dummy (kurgusal) veriler — 10 hasta · Verileri gör ▸<\u002Fbutton>\n    <svg ref=\"{{ lab.ref }}\" sc-camel-view-box=\"0 0 760 300\" style=\"width:100%;height:auto;display:block;touch-action:none;user-select:none\">\n      {{ lab.curves }}\n      <line x1=\"{{ lab.mx }}\" x2=\"{{ lab.mx }}\" y1=\"34\" y2=\"230\" stroke=\"#E0603A\" stroke-width=\"3.5\"><\u002Fline>\n      <line x1=\"{{ lab.dx }}\" x2=\"{{ lab.dx }}\" y1=\"34\" y2=\"230\" stroke=\"#12857A\" stroke-width=\"3.5\" stroke-dasharray=\"7 5\"><\u002Fline>\n      {{ lab.labels }}\n      <line x1=\"50\" x2=\"730\" y1=\"230\" y2=\"230\" stroke=\"#1E2740\" stroke-width=\"1.5\"><\u002Fline>\n      <sc-for list=\"{{ lab.ticks }}\" as=\"t\" hint-placeholder-count=\"0\">\n        <line x1=\"{{ t.x }}\" x2=\"{{ t.x }}\" y1=\"230\" y2=\"236\" stroke=\"#1E2740\"><\u002Fline>\n        {{ t.el }}\n      <\u002Fsc-for>\n      {{ lab.band }}\n      <sc-for list=\"{{ lab.pts }}\" as=\"p\" hint-placeholder-count=\"0\">\n        <g sc-camel-on-pointer-down=\"{{ p.down }}\" style=\"cursor:grab\">\n          <circle cx=\"{{ p.cx }}\" cy=\"{{ p.cy }}\" r=\"13\" fill=\"{{ p.fill }}\" stroke=\"#FFFBF3\" stroke-width=\"2\"><\u002Fcircle>\n          {{ p.el }}\n        <\u002Fg>\n      <\u002Fsc-for>\n      {{ lab.bubble }}\n    <\u002Fsvg>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px 22px;font-size:17px;align-items:center\">\n      <span style=\"display:flex;gap:8px;align-items:center\"><span style=\"width:26px;height:4px;background:#6B4FA0\"><\u002Fspan>verinin şekli (noktalardan çizildi)<\u002Fspan>\n      <span style=\"display:flex;gap:8px;align-items:center\"><span style=\"width:26px;height:0;border-top:3px dashed #1E2740;opacity:.6\"><\u002Fspan>ortalama ve SS ile çizilen simetrik çan<\u002Fspan>\n      <span style=\"display:flex;gap:8px;align-items:center\"><span style=\"width:24px;height:4px;background:#E0603A\"><\u002Fspan>ortalama<\u002Fspan>\n      <span style=\"display:flex;gap:8px;align-items:center\"><span style=\"width:24px;height:0;border-top:4px dashed #12857A\"><\u002Fspan>ortanca<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px\">\n      <div style=\"background:#F5EFE3;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px\">\n        <div style=\"font-size:17px;font-weight:700;color:#C24A26\">Ortalama<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700\">{{ lab.mean }} <span style=\"font-size:18px\">gün<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F5EFE3;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px\">\n        <div style=\"font-size:17px;font-weight:700;color:#0E6E65\">Ortanca<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700\">{{ lab.med }} <span style=\"font-size:18px\">gün<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:{{ lab.sdBg }};border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px\">\n        <div style=\"font-size:17px;font-weight:700;color:#1E2740\">SS<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700\">{{ lab.sd }} <span style=\"font-size:18px\">gün<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F5EFE3;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px\">\n        <div style=\"font-size:17px;font-weight:700;color:#6B4FA0\">Çarpıklık (z³)<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700\">{{ lab.sk }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#6B4FA0;color:#FFFFFF;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;justify-content:center\">\n        <div style=\"font-size:17px;font-weight:700;color:#E4DAF5\">Biçim<\u002Fdiv>\n        <div style=\"font-size:22px;font-weight:700;line-height:1.2\">{{ lab.shape }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n      <button sc-camel-on-click=\"{{ lab.set30 }}\" style=\"font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid #1E2740;background:#1E2740;color:#F5EFE3\">Bir hasta 30 gün yatsın<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ lab.set60 }}\" style=\"font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid #C24A26;background:#C24A26;color:#FFFFFF\">Bir hasta 60 gün yatsın<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ lab.reset }}\" style=\"font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid #1E2740;background:transparent;color:#1E2740\">Başa dön<\u002Fbutton>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:19px;line-height:1.6;text-wrap:pretty;background:{{ lab.noteBg }};border-radius:12px;padding:14px 16px\">{{ lab.note }}<\u002Fp>\n  <\u002Fdiv>\n\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start\">\n    <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font-size:22px;font-weight:700\">Çarpıklık sayısını okuma kuralı (kaba)<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;border-radius:12px;overflow:hidden;font-size:17px;text-align:center\">\n        <div style=\"background:#E4DAF5;padding:12px 6px;display:flex;flex-direction:column;gap:4px\"><b style=\"font-family:'JetBrains Mono',monospace;font-size:20px\">&lt; −1<\u002Fb>sola çarpık<\u002Fdiv>\n        <div style=\"background:#EFE6D3;padding:12px 6px;display:flex;flex-direction:column;gap:4px\"><b style=\"font-family:'JetBrains Mono',monospace;font-size:20px\">−1 … +1<\u002Fb>yaklaşık simetrik<span style=\"font-size:14px;color:#3A4258\">(±0,5 üstü: hafif çarpık)<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#E4DAF5;padding:12px 6px;display:flex;flex-direction:column;gap:4px\"><b style=\"font-family:'JetBrains Mono',monospace;font-size:20px\">&gt; +1<\u002Fb>sağa çarpık<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:18px;line-height:1.55\">İşaret <b>kuyruğun yönünü<\u002Fb>, büyüklük <b>kuyruğun ne kadar uzun<\u002Fb> olduğunu söyler. Excel'de tek adım:<\u002Fp>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;background:#1E2740;color:#F5EFE3;border-radius:10px;padding:12px 16px\">=ÇARPIKLIK(aralık)<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ skModal.open }}\" style=\"align-self:flex-start;font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid #1E2740;background:#6B4FA0;border-color:#6B4FA0;color:#FFFFFF\">Detaylı incele →<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n      <button sc-camel-on-click=\"{{ dmo.skew }}\" style=\"align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;background:#EFE6D3;color:#5A4A2E;padding:6px 12px;border-radius:8px;border:none;cursor:pointer;text-align:left\" style-hover=\"background:#E6DAC2\">Dummy (kurgusal) veriler — 100 hasta · Verileri gör ▸<\u002Fbutton>\n      <div style=\"display:flex;flex-direction:column\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.4fr) 70px minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:2px solid #1E2740;font-size:16px;font-weight:700\"><span>Değişken<\u002Fspan><span style=\"text-align:right\">Çarpıklık (z³)<\u002Fspan><span>Biçim<\u002Fspan><\u002Fdiv>\n        <sc-for list=\"{{ skewTable }}\" as=\"r\" hint-placeholder-count=\"7\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,1.4fr) 70px minmax(0,1fr);gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #E6DDCB;font-size:18px\">\n            <span>{{ r.name }}<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-weight:700;text-align:right\">{{ r.v }}<\u002Fspan>\n            <span style=\"justify-self:start;font-size:15px;font-weight:700;padding:4px 10px;border-radius:999px;background:{{ r.bg }};color:{{ r.color }}\">{{ r.shape }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:17px;line-height:1.5;color:#3A4258;text-wrap:pretty\"><b>Memnuniyet<\u002Fb> 1–5 arası sıralı bir değişken. Çarpıklık burada yalnızca kaba bir fikir verir; raporda ortanca ve yüzde kullanılır.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ dm.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ dm.close }}\" style=\"position:fixed;inset:0;z-index:50;background:rgba(30,39,64,.6);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box\">\n  <div sc-camel-on-click=\"{{ dm.stop }}\" style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;width:min(880px,100%);max-height:calc(100vh - 32px);overflow:auto;box-sizing:border-box;box-shadow:0 20px 60px rgba(30,39,64,.35)\">\n    <div style=\"display:flex;gap:12px;align-items:flex-start;justify-content:space-between\">\n      <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;background:#EFE6D3;color:#5A4A2E;padding:5px 10px;border-radius:8px\">Dummy (kurgusal) veriler<\u002Fspan><div style=\"font-size:24px;font-weight:700;line-height:1.25\">{{ dm.title }}<\u002Fdiv><\u002Fdiv>\n      <button sc-camel-on-click=\"{{ dm.close }}\" aria-label=\"Kapat\" style=\"flex-shrink:0;font:inherit;font-size:22px;font-weight:700;width:44px;height:44px;border-radius:999px;cursor:pointer;border:2px solid #1E2740;background:#1E2740;color:#F5EFE3\">×<\u002Fbutton>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:18px;line-height:1.55;color:#3A4258;text-wrap:pretty\">{{ dm.note }}<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px 18px;font-size:16px\">\n      <sc-for list=\"{{ dm.legend }}\" as=\"l\" hint-placeholder-count=\"0\"><span style=\"display:flex;gap:8px;align-items:center\"><span style=\"width:18px;height:18px;border-radius:4px;background:{{ l.bg }};border:1px solid #D9CFBC\"><\u002Fspan>{{ l.t }}<\u002Fspan><\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;font-size:17px\">\n      <div style=\"display:grid;grid-template-columns:{{ dm.colsCss }};gap:8px;padding:8px 6px;border-bottom:2px solid #1E2740;font-weight:700;font-size:15px\">\n        <sc-for list=\"{{ dm.head }}\" as=\"h\" hint-placeholder-count=\"0\"><span>{{ h.t }}<\u002Fspan><\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-for list=\"{{ dm.rows }}\" as=\"r\" hint-placeholder-count=\"0\">\n        <div style=\"display:grid;grid-template-columns:{{ r.cols }};gap:8px;padding:7px 6px;border-bottom:1px solid #E6DDCB;font-family:'JetBrains Mono',monospace;align-items:center;background:{{ r.bg }}\">\n          <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"0\"><span style=\"min-width:0;overflow-wrap:anywhere\">{{ c.t }}<\u002Fspan><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:18px;line-height:1.55;background:#F5EFE3;border-radius:12px;padding:12px 14px;text-wrap:pretty\">{{ dm.foot }}<\u002Fp>\n  <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ skModal.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ skModal.close }}\" style=\"position:fixed;inset:0;z-index:50;background:rgba(30,39,64,.6);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box\">\n  <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;width:min(920px,100%);max-height:calc(100vh - 32px);overflow:auto;box-sizing:border-box;box-shadow:0 20px 60px rgba(30,39,64,.35)\" sc-camel-on-click=\"{{ skModal.stop }}\">\n    <div style=\"display:flex;gap:12px;align-items:flex-start;justify-content:space-between\">\n      <div style=\"font-size:24px;font-weight:700\">Çarpıklık nasıl hesaplanır? Excel'in arka planda yaptığı<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ skModal.close }}\" aria-label=\"Kapat\" style=\"flex-shrink:0;font:inherit;font-size:22px;font-weight:700;width:44px;height:44px;border-radius:999px;cursor:pointer;border:2px solid #1E2740;background:#1E2740;color:#F5EFE3\">×<\u002Fbutton>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:19px;line-height:1.6;text-wrap:pretty\">Fikir üç kelime: <b>z bul, küpünü al, topla.<\u002Fb> Burada <b>z<\u002Fb> = sapma ÷ SS, yani hastanın ortalamadan kaç SS uzakta olduğu. z'yi 03. bölümde ayrıntılı göreceğiz. Tablo, yukarıdaki noktaların şu anki konumuyla hesaplandı. Pencereyi kapatıp bir noktayı sürüklersen yeniden açtığında sayılar değişmiş olur.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px\">\n      <div style=\"background:#F5EFE3;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:#E0603A\">1 · ORTALAMA<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:20px\">x̄ = {{ sk.mean }} gün<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#F5EFE3;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:#E0603A\">2 · SS (n − 1 ile)<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:20px\">s = {{ sk.sd }} gün<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#F5EFE3;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:#E0603A\">3 · HER HASTAYA<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:20px\">z = (x − x̄) ÷ s → z³<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#6B4FA0;color:#FFFFFF;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:#E4DAF5\">4 · TOPLA, DÜZELT<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:20px\">{{ sk.fTxt }} × {{ sk.sum }} = <b>{{ sk.val }}<\u002Fb><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;font-size:18px\">\n      <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:8px 6px;border-bottom:2px solid #1E2740;font-weight:700;font-size:16px\"><span>Yatış (gün)<\u002Fspan><span>Sapma<\u002Fspan><span>z<\u002Fspan><span>z³<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ sk.rows }}\" as=\"r\" hint-placeholder-count=\"10\">\n        <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:7px 6px;border-bottom:1px solid #E6DDCB;font-family:'JetBrains Mono',monospace;align-items:center;background:{{ r.bg }}\">\n          <span style=\"font-weight:700\">{{ r.x }}<\u002Fspan><span>{{ r.d }}<\u002Fspan><span>{{ r.z }}<\u002Fspan>\n          <span style=\"display:flex;flex-direction:column;gap:3px\"><b>{{ r.z3 }}<\u002Fb><span style=\"height:6px;border-radius:3px;width:{{ r.barW }};background:{{ r.barC }}\"><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:9px 6px;font-family:'JetBrains Mono',monospace;font-weight:700\"><span style=\"grid-column:1 / 4\">Σz³ (hepsinin toplamı)<\u002Fspan><span>{{ sk.sum }}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:19px;line-height:1.6;text-wrap:pretty;background:#F8DDD2;border-radius:12px;padding:12px 14px\">Kırmızı satıra bak: {{ sk.big }} Kuyruktaki tek bir hasta sayının çoğunu belirliyor.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px\">\n      <div style=\"border:2px dashed #6B4FA0;border-radius:14px;padding:14px 16px;font-size:18px;line-height:1.55;text-wrap:pretty\"><b style=\"color:#6B4FA0\">Neden küp?<\u002Fb> Kare alsaydık (Bölüm 6'daki gibi) eksiler kaybolurdu; sağ kuyruk ile sol kuyruğu ayıramazdık. Küp <b>işareti korur<\u002Fb>: (−2)³ = −8, 2³ = +8. Üstelik <b>uzaktakini çok büyütür<\u002Fb>: 1³ = 1 ama 2³ = 8. Bu yüzden uzun kuyruk hangi taraftaysa sonuç o işareti alır.<\u002Fdiv>\n      <div style=\"border:2px dashed #6B4FA0;border-radius:14px;padding:14px 16px;font-size:18px;line-height:1.55;text-wrap:pretty\"><b style=\"color:#6B4FA0\">{{ sk.fTxt }} nedir?<\u002Fb> Aslında z³'lerin ortalamasını istiyoruz; yani kabaca n'ye bölmek. Excel küçük veri için n ÷ ((n − 1)(n − 2)) ile hafif bir düzeltme yapar. Büyük veride bu, 1 ÷ n'ye çok yakındır. SS'deki n − 1 düzeltmesinin akrabası.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ pg.p3 }}\" hint-placeholder-val=\"{{ true }}\">\n<section id=\"s3\" data-screen-label=\"03 Standart puan\" style=\"display:flex;flex-direction:column;gap:24px;scroll-margin-top:16px\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#E0603A;font-weight:700\">03<\u002Fspan>\n    <h2 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(30px,4vw,46px);margin:0;line-height:1.1\">Standart puan (z): \"ortalamadan kaç SS uzakta?\"<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"background:#1E2740;color:#F5EFE3;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n    <div style=\"font-size:21px;font-weight:700;line-height:1.45\">Ayşe matematikten <span style=\"font-family:'JetBrains Mono',monospace\">70<\u002Fspan>, Türkçeden <span style=\"font-family:'JetBrains Mono',monospace\">80<\u002Fspan> aldı. Hangi derste daha başarılı?<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n      <sc-for list=\"{{ ay.opts }}\" as=\"o\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.color }}\">{{ o.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ ay.done }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"margin:0;font-size:19px;line-height:1.6;color:#E7E1D4;text-wrap:pretty\"><b style=\"color:{{ ay.tagColor }}\">{{ ay.tag }}<\u002Fb> Çoğu kişi \"80 &gt; 70, Türkçe\" der. Ama notu tek başına okuyamayız; <b>sınıfın geri kalanına<\u002Fb> bakmalıyız. Sınıf bilgisi: <b>Matematik<\u002Fb> ortalama 60, SS 5 · <b>Türkçe<\u002Fb> ortalama 75, SS 10. Önce bu sayıların nereden geldiğini hatırlayalım, sonra z'yi hesaplayalım.<\u002Fp>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ ay.done }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-direction:column;gap:18px\">\n    <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:32px;margin:0;line-height:1.15\">Hatırlayalım: ortalama, varyans ve SS nereden geliyor?<\u002Fh3>\n    <p style=\"margin:0;font-size:19px;line-height:1.6;max-width:780px;color:#3A4258;text-wrap:pretty\">Her iki sınıfta da Ayşe dahil 9 öğrenci var. Yayılım ölçüleri bölümünde yaptığımız adımları tekrar uygulayalım. <b>Hesabı görmek için sınıfa dokun.<\u002Fb><\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px;align-items:start\">\n      <sc-for list=\"{{ cls }}\" as=\"c\" hint-placeholder-count=\"2\">\n        <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n          <button sc-camel-on-click=\"{{ c.toggle }}\" style=\"font:inherit;display:flex;justify-content:space-between;align-items:center;gap:12px;background:transparent;border:none;padding:0;cursor:pointer;color:#1E2740;text-align:left\">\n            <span style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:22px;font-weight:700\">{{ c.name }} sınıfı<\u002Fspan><span style=\"font-size:17px;color:#3A4258\">ortalama {{ c.mean }} · SS {{ c.sd }} puan<\u002Fspan><\u002Fspan>\n            <span style=\"flex-shrink:0;font-size:16px;font-weight:700;padding:8px 14px;border-radius:999px;border:2px solid #1E2740;background:{{ c.btnBg }};color:{{ c.btnColor }}\">{{ c.btn }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ c.open }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;flex-direction:column;font-size:17px\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:6px;padding:6px 4px;border-bottom:2px solid #1E2740;font-weight:700;font-size:15px\"><span>Öğrenci<\u002Fspan><span>Not<\u002Fspan><span>Sapma<\u002Fspan><span>Sapma²<\u002Fspan><\u002Fdiv>\n            <sc-for list=\"{{ c.rows }}\" as=\"r\" hint-placeholder-count=\"9\">\n              <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:6px;padding:5px 4px;border-bottom:1px solid #E6DDCB;font-family:'JetBrains Mono',monospace;background:{{ r.bg }}\"><span style=\"font-family:'DM Sans',sans-serif\">{{ r.who }}<\u002Fspan><span style=\"font-weight:700\">{{ r.x }}<\u002Fspan><span>{{ r.d }}<\u002Fspan><span>{{ r.d2 }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;font-family:'JetBrains Mono',monospace;font-size:17px;line-height:1.55\">\n            <div><b style=\"color:#E0603A\">1 · Ortalama<\u002Fb><br>{{ c.sum }} ÷ 9 = <b>{{ c.mean }}<\u002Fb><\u002Fdiv>\n            <div><b style=\"color:#E0603A\">2 · Sapma<\u002Fb> = not − ortalama<br><span style=\"font-family:'DM Sans',sans-serif\">Sapmaların toplamı her zaman 0'dır.<\u002Fspan><\u002Fdiv>\n            <div><b style=\"color:#E0603A\">3 · Varyans<\u002Fb> = sapma²'lerin toplamı ÷ (n − 1)<br>{{ c.ss }} ÷ 8 = <b>{{ c.vr }}<\u002Fb> puan²<\u002Fdiv>\n            <div style=\"background:#6B4FA0;color:#FFFFFF;border-radius:10px;padding:10px 12px\"><b>4 · SS<\u002Fb> = √varyans = √{{ c.vr }} = <b style=\"font-size:22px\">{{ c.sd }} puan<\u002Fb><\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"background:#1E2740;color:#F5EFE3;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"font-size:22px;font-weight:700\">Şimdi z formülünü parça parça okuyalım<\u002Fdiv>\n      <div style=\"font-family:'DM Serif Display',serif;font-size:clamp(28px,4.4vw,48px);line-height:1.2;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline\"><span>z =<\u002Fspan><span>(<\u002Fspan><span style=\"color:#F4A48A\">değer<\u002Fspan><span>−<\u002Fspan><span style=\"color:#7FD8CB\">ortalama<\u002Fspan><span>)<\u002Fspan><span>÷<\u002Fspan><span style=\"color:#C9B6EE\">SS<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px\">\n        <div style=\"background:#2B3553;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px\"><b style=\"color:#F4A48A;font-size:19px\">değer<\u002Fb><span style=\"font-size:18px;line-height:1.5\">İncelediğimiz <b>tek bir kişinin<\u002Fb> ölçümü. Burada Ayşe'nin matematik notu: <b>70<\u002Fb>.<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#2B3553;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px\"><b style=\"color:#7FD8CB;font-size:19px\">değer − ortalama<\u002Fb><span style=\"font-size:18px;line-height:1.5\">Ortalamadan ne kadar uzak? 70 − 60 = <b>10 puan<\u002Fb>. Ama 10 puan çok mu, az mı? Henüz bilmiyoruz.<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#2B3553;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px\"><b style=\"color:#C9B6EE;font-size:19px\">÷ SS<\u002Fb><span style=\"font-size:18px;line-height:1.5\">SS, o sınıfta notların ortalamadan <b>tipik uzaklığı<\u002Fb>. Farkı buna bölünce cevap çıkar: \"tipik uzaklığın kaç katı?\"<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F5EFE3;color:#1E2740;border-radius:14px;padding:16px 18px;font-size:19px;line-height:1.6;text-wrap:pretty\"><b>Adım benzetmesi:<\u002Fb> SS'yi o sınıfın \"adım boyu\" gibi düşün. Matematikte bir adım <b>5 puan<\u002Fb>: 10 puan fark = <b>2 adım<\u002Fb>. Türkçede bir adım <b>10 puan<\u002Fb>: aynı 10 puan fark orada yalnızca <b>1 adım<\u002Fb> olurdu. Aynı fark, farklı sınıfta farklı anlam taşır. <b>z, adım sayısıdır.<\u002Fb> SS'ye bölmemizin sebebi bu: farkı sınıfın kendi ölçüsüyle ölçmek.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ ay.done }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start\">\n    <div style=\"flex:1.5 1 460px;min-width:0;background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:14px\">\n      <svg sc-camel-view-box=\"0 0 760 325\" style=\"width:100%;height:auto;display:block\">{{ ay.els }}<\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:#6B6457\">Adım {{ ay.stepNo }} / 4<\u002Fdiv>\n      <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:30px;margin:0;line-height:1.15\">{{ ay.title }}<\u002Fh3>\n      <p style=\"margin:0;font-size:19px;line-height:1.6;text-wrap:pretty\">{{ ay.text }}<\u002Fp>\n      <sc-if value=\"{{ ay.hasCalc }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:20px;background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:12px;padding:14px;line-height:1.8\">{{ ay.calc1 }}<br>{{ ay.calc2 }}<br><b style=\"color:#6B4FA0\">{{ ay.calc3 }}<\u002Fb><\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;gap:10px\">\n        <button sc-camel-on-click=\"{{ ay.prev }}\" style=\"font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid #1E2740;background:transparent;color:#1E2740;opacity:{{ ay.prevOp }}\">← Geri<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ ay.next }}\" style=\"font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid #1E2740;background:#1E2740;color:#F5EFE3;opacity:{{ ay.nextOp }}\">İleri →<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ ay.restart }}\" style=\"font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid #1E2740;background:transparent;color:#1E2740\">↺ Baştan<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px\">\n    <div style=\"font-size:22px;font-weight:700\">z'nin üç özelliği<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px\">\n      <div style=\"background:#F5EFE3;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px\"><b style=\"font-family:'JetBrains Mono',monospace;font-size:26px;color:#6B4FA0\">z = 0<\u002Fb><span style=\"font-size:18px;line-height:1.5\">Değer ortalamanın tam üstünde.<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#F5EFE3;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px\"><b style=\"font-family:'JetBrains Mono',monospace;font-size:26px;color:#6B4FA0\">− / +<\u002Fb><span style=\"font-size:18px;line-height:1.5\">İşaret yönü söyler: eksi ortalamanın altında, artı üstünde.<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#F5EFE3;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px\"><b style=\"font-family:'JetBrains Mono',monospace;font-size:26px;color:#6B4FA0\">birimsiz<\u002Fb><span style=\"font-size:18px;line-height:1.5\">mmHg da gider, kg da gider. Bu yüzden farklı birimleri karşılaştırabiliriz.<\u002Fspan><button sc-camel-on-click=\"{{ pg.go4 }}\" style=\"align-self:flex-start;margin-top:4px;font:inherit;font-size:16px;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer;border:2px solid #6B4FA0;background:#6B4FA0;color:#FFFFFF\">04 · Birimsizliği keşfet →<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:18px\">Excel:<span style=\"font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;background:#1E2740;color:#F5EFE3;border-radius:10px;padding:8px 14px\">=STANDARTLAŞTIRMA(değer; ortalama; ss)<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#1E2740;color:#F5EFE3;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"font-size:22px;font-weight:700\">Çarpıklık ile standartlaştırma (z) aynı şey mi? Hayır, ama akraba.<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px\">\n      <div style=\"background:#2B3553;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px\"><b style=\"font-family:'JetBrains Mono',monospace;font-size:24px;color:#C9B6EE\">z<\u002Fb><span style=\"font-size:18px;line-height:1.55\"><b>Tek bir değer<\u002Fb> hakkında: \"Bu hasta ortalamadan kaç SS uzakta?\" Her hastanın kendi z'si var: 10 hasta → 10 tane z.<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#2B3553;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px\"><b style=\"font-family:'JetBrains Mono',monospace;font-size:24px;color:#F4A48A\">çarpıklık<\u002Fb><span style=\"font-size:18px;line-height:1.55\"><b>Bütün veri<\u002Fb> hakkında: \"Kuyruk hangi yönde, ne kadar uzun?\" Bütün veri için tek bir sayı.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:19px;line-height:1.6;color:#E7E1D4;text-wrap:pretty\"><b style=\"color:#FFFFFF\">Bağlantı:<\u002Fb> Çarpıklık z'lerden yapılır. 02. bölümdeki tabloda her hastanın z'sinin küpünü alıp topladık. z bir tuğla, çarpıklık o tuğlalarla örülen duvarın eğimi. Bir fark daha: standartlaştırma veriyi <b style=\"color:#FFFFFF\">şeklini bozmadan<\u002Fb> yeni bir cetvele taşır. Çarpık bir veri z'ye çevrilince de aynı ölçüde çarpık kalır.<\u002Fp>\n  <\u002Fdiv>\n\n  <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:32px;margin:12px 0 0;line-height:1.15\">Tanıdık 10 hasta, z sayı doğrusunda<\u002Fh3>\n  <p style=\"font-size:19px;line-height:1.6;max-width:780px;margin:0;color:#3A4258;text-wrap:pretty\">100 hastada sistolik tansiyonun ortalaması <b>130,3 mmHg<\u002Fb>, SS'si <b>17,7 mmHg<\u002Fb>. Üstteki cetvel mmHg, alttaki z. Aynı noktalar, yeni bir cetvel. <b>Bir hastaya dokun<\u002Fb>, hesabını gör.<\u002Fp>\n  <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px\">\n    <button sc-camel-on-click=\"{{ dmo.tans10 }}\" style=\"align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;background:#EFE6D3;color:#5A4A2E;padding:6px 12px;border-radius:8px;border:none;cursor:pointer;text-align:left\" style-hover=\"background:#E6DAC2\">Dummy (kurgusal) veriler — 100 hasta · Verileri gör ▸<\u002Fbutton>\n    <svg sc-camel-view-box=\"0 0 760 270\" style=\"width:100%;height:auto;display:block\">{{ pts.els }}<\u002Fsvg>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n      <sc-for list=\"{{ pts.chips }}\" as=\"c\" hint-placeholder-count=\"10\">\n        <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"font:inherit;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;padding:7px 12px;border-radius:10px;cursor:pointer;border:1.5px solid #1E2740;background:{{ c.bg }};color:{{ c.color }}\">{{ c.t }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"background:#1E2740;color:#F5EFE3;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"font-size:18px;font-weight:700\">Hasta {{ pts.id }} · {{ pts.v }} mmHg<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:clamp(17px,2.4vw,22px);line-height:1.7\">z = ({{ pts.v }} − 130,3) ÷ 17,7 = {{ pts.diff }} ÷ 17,7 ≈ <b style=\"color:#C9B6EE;font-size:1.3em\">{{ pts.z }}<\u002Fb><\u002Fdiv>\n      <div style=\"font-size:18px;color:#E7E1D4\">→ {{ pts.read }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:16px;color:#6B6457;line-height:1.5\">Not: z puanları yuvarlanmamış ortalama ve SS ile hesaplandı. Elle hesaplarsan son basamak 1 farklı çıkabilir.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:32px;margin:12px 0 0;line-height:1.15\">Gerçek hayatta z<\u002Fh3>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px\">\n    <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-size:21px;font-weight:700\">Çocuk büyüme eğrileri<\u002Fdiv>\n      <p style=\"margin:0;font-size:18px;line-height:1.55;text-wrap:pretty\">Çocuğun boyu, aynı yaştaki çocuklara göre z puanına çevrilir. Yaşa göre boy z puanı <b>−2'nin altındaysa<\u002Fb> \"bodurluk\" denir.<\u002Fp>\n      <div style=\"font-size:15px;color:#6B6457;margin-top:auto\">Kaynak: DSÖ, WHO Child Growth Standards<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-size:21px;font-weight:700\">Seçim sonuçları<\u002Fdiv>\n      <p style=\"margin:0;font-size:18px;line-height:1.55;text-wrap:pretty\">Bir ilde partilerin aldığı oy, o partinin bütün illerdeki ortalamasıyla karşılaştırılır.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:6px;font-family:'JetBrains Mono',monospace;font-size:16px;line-height:1.5;background:#F5EFE3;border-radius:10px;padding:10px 12px\">\n        <span><b>A<\u002Fb>: %40 · ort. %30, SS 5 → z = <b style=\"color:#0E6E65\">+2<\u002Fb><\u002Fspan>\n        <span><b>B<\u002Fb>: %25 · ort. %20, SS 10 → z = <b>+0,5<\u002Fb><\u002Fspan>\n        <span><b>C<\u002Fb>: %8 · ort. %15, SS 3,5 → z = <b style=\"color:#C24A26\">−2<\u002Fb><\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:18px;line-height:1.55;text-wrap:pretty\">Bu il A'nın <b>kalesi<\u002Fb>, C için ise çok zayıf bir il. B'nin 5 puanlık farkı sıradan: B'nin oyu illere göre zaten çok değişiyor.<\u002Fp>\n      <div style=\"font-size:15px;color:#6B6457;margin-top:auto\">Kurgusal örnek<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-size:21px;font-weight:700\">ÖSYM puanları<\u002Fdiv>\n      <p style=\"margin:0;font-size:18px;line-height:1.55;text-wrap:pretty\">Ham puanlar, ortalaması ve standart sapması kullanılarak <b>standart puana<\u002Fb> çevrilir. Böylece zor ve kolay testler karşılaştırılabilir hâle gelir.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:6px;font-family:'JetBrains Mono',monospace;font-size:16px;line-height:1.5;background:#F5EFE3;border-radius:10px;padding:10px 12px\">\n        <span>Türkçe: 30 net · ort. 25, SS 5 → z = <b>1<\u002Fb><\u002Fspan>\n        <span>Fen: 15 net · ort. 8, SS 3,5 → z = <b style=\"color:#0E6E65\">2<\u002Fb><\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:18px;line-height:1.55;text-wrap:pretty\">Kurgusal örnek: Ali'nin Fen neti az görünüyor ama Fen zor bir test; Ali orada adayların çok daha önünde.<\u002Fp>\n      <div style=\"font-size:15px;color:#6B6457;margin-top:auto\">Kaynak: ÖSYM puan hesaplama açıklamaları<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ pg.p4 }}\" hint-placeholder-val=\"{{ true }}\">\n<section id=\"s3b\" data-screen-label=\"04 Birimsizlik\" style=\"display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#E0603A;font-weight:700\">04<\u002Fspan>\n    <h2 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(30px,4vw,46px);margin:0;line-height:1.1\">Birimsiz: farklı şeyleri aynı cetvelde karşılaştırmak<\u002Fh2>\n  <\u002Fdiv>\n  <p style=\"font-size:19px;line-height:1.6;max-width:780px;margin:0;color:#3A4258;text-wrap:pretty\">Tansiyon mmHg ile, kilo kg ile, koşu saniyeyle, satış adetle ölçülür. \"162 mmHg mi büyük, 91 kg mı?\" sorusu anlamsızdır. z ise <b>birimsizdir<\u002Fb>: her ölçümü kendi grubunun \"adım boyuyla\" (SS) ölçer. Birim gider, geriye yalnızca \"kaç adım uzakta?\" kalır. Bu sayede her şey <b>aynı cetvele<\u002Fb> taşınır.<\u002Fp>\n  <div style=\"background:#1E2740;color:#F5EFE3;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"font-size:21px;font-weight:700;line-height:1.45\">Hasta 1052: tansiyonu 162 mmHg, kilosu 91 kg. Hangisi kendi grubunda daha sıra dışı?<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n      <sc-for list=\"{{ q52.opts }}\" as=\"o\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.color }}\">{{ o.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ q52.done }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <p style=\"margin:0;font-size:19px;line-height:1.6;color:#E7E1D4;text-wrap:pretty\"><b style=\"color:{{ q52.tagColor }}\">{{ q52.tag }}<\u002Fb> mmHg ile kg'ı doğrudan karşılaştıramayız, ama z'leri karşılaştırabiliriz. İkisi de birimsiz.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px\">\n          <div style=\"background:#6B4FA0;border-radius:14px;padding:14px 16px\"><div style=\"font-size:17px\">Tansiyon z<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:40px;font-weight:700\">1,79<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#2B3553;border-radius:14px;padding:14px 16px\"><div style=\"font-size:17px\">Kilo z<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:40px;font-weight:700\">1,40<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:19px;line-height:1.6;color:#E7E1D4\">1,79 &gt; 1,40 → <b>tansiyonu<\u002Fb> kendi grubunda daha sıra dışı.<\u002Fp>\n        <button sc-camel-on-click=\"{{ q52.restart }}\" style=\"align-self:flex-start;font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid #F5EFE3;background:transparent;color:#F5EFE3\">↺ Soruyu baştan sor<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:32px;margin:12px 0 0;line-height:1.15\">Birimler nereye gidiyor?<\u002Fh3>\n  <p style=\"font-size:19px;line-height:1.6;max-width:780px;margin:0;color:#3A4258;text-wrap:pretty\">Bir alan seç. <b>Kaydırıcılarla değerleri değiştir<\u002Fb>: üstte iki ayrı cetvel (iki ayrı birim), altta tek bir z cetveli. Ortalamalar ve SS adımları alt alta hizalanınca iki ölçüm aynı dili konuşur.<\u002Fp>\n  <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        <sc-for list=\"{{ bz.tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"font:inherit;font-size:17px;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer;border:2px solid #1E2740;background:{{ t.bg }};color:{{ t.color }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ dmo.bz }}\" style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;background:#EFE6D3;color:#5A4A2E;padding:6px 12px;border-radius:8px;border:none;cursor:pointer;text-align:left\" style-hover=\"background:#E6DAC2\">Kurgusal örnekler · Verileri gör ▸<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:4px\">\n      <div style=\"font-size:21px;font-weight:700;line-height:1.4;text-wrap:pretty\">{{ bz.q }}<\u002Fdiv>\n      <div style=\"font-size:17px;color:#3A4258\">Karşılaştırma grubu: {{ bz.grp }}<\u002Fdiv>\n    <\u002Fdiv>\n    <svg sc-camel-view-box=\"0 0 760 345\" style=\"width:100%;height:auto;display:block\">{{ bz.els }}<\u002Fsvg>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px\">\n      <sc-for list=\"{{ bz.ms }}\" as=\"m\" hint-placeholder-count=\"2\">\n        <div style=\"background:#F5EFE3;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;border-top:5px solid {{ m.col }}\">\n          <div style=\"display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap\"><b style=\"font-size:20px\">{{ m.nm }}<\u002Fb><span style=\"font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700\">{{ m.vT }} {{ m.u }}<\u002Fspan><\u002Fdiv>\n          <input type=\"range\" min=\"{{ m.min }}\" max=\"{{ m.max }}\" step=\"{{ m.st }}\" value=\"{{ m.v }}\" sc-camel-on-change=\"{{ m.onV }}\" style=\"width:100%;height:28px;margin:0;accent-color:{{ m.col }}\">\n          <div style=\"font-size:16px;color:#3A4258\">Grup: ortalama {{ m.mT }} {{ m.u }}, SS {{ m.sT }} {{ m.u }}<\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:16px;line-height:1.9;background:#FFFBF3;border-radius:10px;padding:10px 12px;overflow-wrap:anywhere\">\n            <div>z = ({{ m.vT }} {{ m.u }} − {{ m.mT }} {{ m.u }}) ÷ {{ m.sT }} {{ m.u }}<\u002Fdiv>\n            <div>= {{ m.dT }} <span style=\"text-decoration:line-through;text-decoration-color:#C24A26;text-decoration-thickness:2px;color:#6B6457\">{{ m.u }}<\u002Fspan> ÷ {{ m.sT }} <span style=\"text-decoration:line-through;text-decoration-color:#C24A26;text-decoration-thickness:2px;color:#6B6457\">{{ m.u }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:baseline\">= <b style=\"font-size:26px;color:{{ m.col }}\">{{ m.zT }}<\u002Fb><span style=\"font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;color:#C24A26\">birim yok: üstteki ve alttaki birim birbirini götürdü<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"background:#1E2740;color:#F5EFE3;border-radius:14px;padding:16px 18px;font-size:19px;line-height:1.6;text-wrap:pretty\">{{ bz.verdict }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ bz.reset }}\" style=\"align-self:flex-start;font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid #1E2740;background:transparent;color:#1E2740\">↺ Değerleri sıfırla<\u002Fbutton>\n    <p style=\"margin:0;font-size:18px;line-height:1.55;text-wrap:pretty;border:2px dashed #6B4FA0;border-radius:12px;padding:12px 14px\">{{ bz.tip }}<\u002Fp>\n  <\u002Fdiv>\n\n  <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:32px;margin:12px 0 0;line-height:1.15\">Hepsi tek cetvelde<\u002Fh3>\n  <p style=\"font-size:19px;line-height:1.6;max-width:780px;margin:0;color:#3A4258;text-wrap:pretty\">Sekiz ölçüm, yedi farklı birim: mmHg, kg, saniye, metre, adet, puan, saat, adım. Ham sayılarla sıralamak imkânsız. z ile sıralamak kolay. Yukarıda kaydırıcıyı oynattıysan burası da değişir.<\u002Fp>\n  <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <sc-for list=\"{{ bz.all }}\" as=\"r\" hint-placeholder-count=\"8\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) 64px;gap:12px;align-items:center\">\n          <div style=\"display:flex;flex-direction:column;min-width:0\"><b style=\"font-size:17px\">{{ r.nm }}<\u002Fb><span style=\"font-size:15px;color:#6B6457\">{{ r.tab }} · {{ r.vT }}<\u002Fspan><\u002Fdiv>\n          <div style=\"position:relative;height:26px;background:#F5EFE3;border-radius:6px\">\n            <span style=\"position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:#1E2740\"><\u002Fspan>\n            <span style=\"position:absolute;top:4px;bottom:4px;left:{{ r.left }};width:{{ r.w }};background:{{ r.col }};border-radius:4px\"><\u002Fspan>\n          <\u002Fdiv>\n          <b style=\"font-family:'JetBrains Mono',monospace;font-size:18px;text-align:right\">{{ r.zT }}<\u002Fb>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"display:grid;grid-tem
