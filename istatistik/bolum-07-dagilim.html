plate-columns:minmax(0,1fr) minmax(0,1.5fr) 64px;gap:12px\">\n        <span><\u002Fspan>\n        <div style=\"display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:14px;color:#6B6457\"><span>−3<\u002Fspan><span>−2<\u002Fspan><span>−1<\u002Fspan><span>0<\u002Fspan><span>+1<\u002Fspan><span>+2<\u002Fspan><span>+3<\u002Fspan><\u002Fdiv>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:#6B6457;text-align:right\">z<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border:2px dashed #6B4FA0;border-radius:18px;padding:20px 22px;font-size:19px;line-height:1.6;text-wrap:pretty\"><b style=\"color:#6B4FA0\">İki dikkat noktası.<\u002Fb> (1) <b>Doğru grup<\u002Fb>: 91 kg'ı 100 yetişkin hastayla karşılaştırdık. Aynı kiloyu çocuklarla ya da halterecilerle karşılaştırsak z bambaşka olurdu. (2) <b>İşaret ve anlam<\u002Fb>: |z| sıra dışılığı söyler, iyi mi kötü mü olduğunu bağlam söyler. Koşuda −2 harika, uykuda −2 kötü bir gece.<\u002Fdiv>\n  <div style=\"background:#6B4FA0;color:#FFFFFF;border-radius:18px;padding:22px 24px;font-family:'DM Serif Display',serif;font-size:clamp(26px,3.4vw,38px);line-height:1.2;text-align:center\">Birim gider, anlam kalır: \"kendi grubunda kaç adım uzakta?\"<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ pg.p5 }}\" hint-placeholder-val=\"{{ true }}\">\n<section id=\"s4\" data-screen-label=\"05 Ortalama ± SS\" style=\"display:flex;flex-direction:column;gap:24px;scroll-margin-top:16px\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#E0603A;font-weight:700\">05<\u002Fspan>\n    <h2 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(30px,4vw,46px);margin:0;line-height:1.1\">Laboratuvar: ortalama ± 1, 2, 3 SS<\u002Fh2>\n  <\u002Fdiv>\n  <p style=\"font-size:19px;line-height:1.6;max-width:780px;margin:0;color:#3A4258;text-wrap:pretty\"><b>± \"artı eksi\"<\u002Fb> demek: ortalamadan hem sola (eksi) hem sağa (artı) <b>aynı uzaklıkta<\u002Fb> git. <b>ortalama ± 1 SS<\u002Fb> = \"ortalama − 1 SS ile ortalama + 1 SS arası\". Örnek: matematik sınıfında 60 ± 5 → <b>55 ile 65 puan arası<\u002Fb>.<\u002Fp>\n  <div style=\"background:#1E2740;color:#F5EFE3;border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:10px\">\n    <div style=\"font-size:22px;font-weight:700\">Gerçek veri neredeyse hiç tam simetrik değildir<\u002Fdiv>\n    <p style=\"margin:0;font-size:19px;line-height:1.6;color:#E7E1D4;text-wrap:pretty\">%68 – %95 – %99,7 kuralı <b style=\"color:#FFFFFF\">tam simetrik çan<\u002Fb> (normal dağılım) için hesaplandı. Gerçek laboratuvar değerleri hep biraz bir yana yatıktır. Asıl soru şu: <b style=\"color:#FFFFFF\">veri ne kadar yatıksa kural ne kadar bozulur?<\u002Fb> Aşağıda bir test seç, SS bandını genişlet (1 SS, 1,3 SS …) ve çarpıklığı kaydır.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        <sc-for list=\"{{ nrm.tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"font:inherit;font-size:17px;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer;border:2px solid #1E2740;background:{{ t.bg }};color:{{ t.color }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ dmo.lab5 }}\" style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;background:#EFE6D3;color:#5A4A2E;padding:6px 12px;border-radius:8px;border:none;cursor:pointer;text-align:left\" style-hover=\"background:#E6DAC2\">Dummy (kurgusal) veriler — 100 hasta · Verileri gör ▸<\u002Fbutton>\n    <\u002Fdiv>\n    <svg sc-camel-view-box=\"0 0 760 340\" style=\"width:100%;height:auto;display:block\">{{ nrm.els }}<\u002Fsvg>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px\">\n      <div style=\"background:#F5EFE3;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-size:18px;font-weight:700\">SS bandı: <span style=\"font-family:'JetBrains Mono',monospace;color:#6B4FA0\">± {{ nrm.kTxt }} SS<\u002Fspan><\u002Fdiv>\n        <input type=\"range\" min=\"0\" max=\"3\" step=\"0.1\" value=\"{{ nrm.k }}\" sc-camel-on-change=\"{{ nrm.onK }}\" style=\"width:100%;height:28px;margin:0\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          <sc-for list=\"{{ nrm.chips }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"font:inherit;font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer;border:2px solid #6B4FA0;background:{{ c.bg }};color:{{ c.color }}\">{{ c.t }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F5EFE3;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-size:18px;font-weight:700\">Çarpıklık (z³): <span style=\"font-family:'JetBrains Mono',monospace;color:#6B4FA0\">{{ nrm.gTxt }}<\u002Fspan> · {{ nrm.gName }}<\u002Fdiv>\n        <input type=\"range\" min=\"-2\" max=\"2\" step=\"0.1\" value=\"{{ nrm.g }}\" sc-camel-on-change=\"{{ nrm.onG }}\" style=\"width:100%;height:28px;margin:0\">\n        <div style=\"display:flex;justify-content:space-between;font-size:15px;color:#3A4258\"><span>← sola çarpık<\u002Fspan><span>simetrik<\u002Fspan><span>sağa çarpık →<\u002Fspan><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ nrm.resetG }}\" style=\"align-self:flex-start;font:inherit;font-size:15px;font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer;border:1.5px solid #1E2740;background:transparent;color:#1E2740\">{{ nrm.resetTxt }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:clamp(18px,2.6vw,24px);font-weight:700;line-height:1.5;background:#1E2740;color:#F5EFE3;border-radius:12px;padding:12px 16px;overflow-wrap:anywhere\">{{ nrm.mT }} ± {{ nrm.kTxt }} × {{ nrm.sT }} = <span style=\"color:#C9B6EE\">{{ nrm.loU }} – {{ nrm.hiU }} {{ nrm.u }}<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px\">\n      <div style=\"background:#F5EFE3;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:16px;color:#3A4258\">Altında (&lt; {{ nrm.loU }})<\u002Fspan><b style=\"font-family:'JetBrains Mono',monospace;font-size:clamp(20px,3vw,28px)\">%{{ nrm.lo }}<\u002Fb><span style=\"font-size:15px;color:#3A4258\">100 hastadan ≈ {{ nrm.loN }}<\u002Fspan><span style=\"font-size:15px;color:#6B6457;border-top:1px solid #D9CFBC;padding-top:4px;margin-top:4px\">simetrik olsaydı %{{ nrm.sLo }}<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#6B4FA0;color:#FFFFFF;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:16px\">Bandın içinde<\u002Fspan><b style=\"font-family:'JetBrains Mono',monospace;font-size:clamp(20px,3vw,28px)\">%{{ nrm.inn }}<\u002Fb><span style=\"font-size:15px\">100 hastadan ≈ {{ nrm.inN }}<\u002Fspan><span style=\"font-size:15px;color:#E4DAF5;border-top:1px solid #8E75BE;padding-top:4px;margin-top:4px\">simetrik olsaydı %{{ nrm.sIn }}<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#F5EFE3;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:16px;color:#3A4258\">Üstünde (&gt; {{ nrm.hiU }})<\u002Fspan><b style=\"font-family:'JetBrains Mono',monospace;font-size:clamp(20px,3vw,28px)\">%{{ nrm.hi }}<\u002Fb><span style=\"font-size:15px;color:#3A4258\">100 hastadan ≈ {{ nrm.hiN }}<\u002Fspan><span style=\"font-size:15px;color:#6B6457;border-top:1px solid #D9CFBC;padding-top:4px;margin-top:4px\">simetrik olsaydı %{{ nrm.sHi }}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:19px;line-height:1.6;text-wrap:pretty;background:#E4DAF5;border-radius:12px;padding:14px 16px\"><b>Somut hasta:<\u002Fb> {{ nrm.patient }}<\u002Fp>\n    <p style=\"margin:0;font-size:19px;line-height:1.6;text-wrap:pretty;background:#F5EFE3;border-radius:12px;padding:14px 16px\">{{ nrm.note }}<\u002Fp>\n        <button sc-camel-on-click=\"{{ nrm.resetAll }}\" style=\"align-self:flex-start;font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid #1E2740;background:transparent;color:#1E2740\">↺ Başa dön<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start\">\n    <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n      <button sc-camel-on-click=\"{{ dmo.ta }}\" style=\"align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;background:#EFE6D3;color:#5A4A2E;padding:6px 12px;border-radius:8px;border:none;cursor:pointer;text-align:left\" style-hover=\"background:#E6DAC2\">Dummy (kurgusal) veriler — 100 hasta · Verileri gör ▸<\u002Fbutton>\n      <div style=\"font-size:22px;font-weight:700\">Gerçek veriyle sağlama: sistolik tansiyon<\u002Fdiv>\n      <sc-for list=\"{{ waffles }}\" as=\"w\" hint-placeholder-count=\"2\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:center\">\n          <div style=\"display:grid;grid-template-columns:repeat(10,14px);gap:3px\">\n            <sc-for list=\"{{ w.cells }}\" as=\"c\" hint-placeholder-count=\"0\">\n              <span style=\"width:14px;height:14px;border-radius:3px;background:{{ c.bg }}\"><\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px;flex:1 1 180px;min-width:0\">\n            <div style=\"font-size:18px;font-weight:700\">{{ w.label }}<\u002Fdiv>\n            <div style=\"font-size:17px;color:#3A4258\">{{ w.range }}<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:#6B4FA0\">{{ w.n }} / 100 hasta<\u002Fdiv>\n            <div style=\"font-size:17px;color:#3A4258\">Kural: ≈ %{{ w.rule }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font-size:20px;font-weight:700;color:#0E6E65\">Kural tutuyor! Tansiyon yaklaşık simetrik.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#1E2740;color:#F5EFE3;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px\">\n      <button sc-camel-on-click=\"{{ dmo.bek }}\" style=\"align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;background:#EFE6D3;color:#5A4A2E;padding:6px 12px;border-radius:8px;border:none;cursor:pointer;text-align:left\" style-hover=\"background:#E6DAC2\">Dummy (kurgusal) veriler — 100 hasta · Verileri gör ▸<\u002Fbutton>\n      <div style=\"font-size:22px;font-weight:700\">Ama çarpık veride çalışmaz: bekleme süresi<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:20px;line-height:1.8;background:#2B3553;border-radius:12px;padding:14px\">ortalama − 1 SS<br>= 36,8 − 37,4<br>= <b style=\"color:#F4A48A;font-size:30px\">−0,6 dk<\u002Fb><\u002Fdiv>\n      <p style=\"margin:0;font-size:19px;line-height:1.6;color:#E7E1D4;text-wrap:pretty\">Negatif bekleme olmaz! Bekleme süresi sağa çarpık (çarpıklık 3,04). Bu yüzden ±SS kuralı da, \"ortalama ± SS\" yazımı da çarpık veride <b style=\"color:#FFFFFF\">yanıltır<\u002Fb>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start\">\n    <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font-size:22px;font-weight:700\">%68 ne demek?<\u002Fdiv>\n      <p style=\"margin:0;font-size:19px;line-height:1.6;text-wrap:pretty\"><b>100 kişiden yaklaşık 68'i<\u002Fb> ortalamaya 1 SS'den daha yakın. Kalan 32 kişi ikiye bölünür: yaklaşık <b>16'sı altta, 16'sı üstte<\u002Fb>.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:16fr 68fr 16fr;border-radius:10px;overflow:hidden;font-size:16px;font-weight:700;text-align:center\">\n        <span style=\"background:#E6DDCB;padding:10px 2px\">16<\u002Fspan><span style=\"background:#6B4FA0;color:#FFFFFF;padding:10px 2px\">68 kişi<\u002Fspan><span style=\"background:#E6DDCB;padding:10px 2px\">16<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;font-size:18px;line-height:1.55\">\n        <div style=\"background:#F5EFE3;border-radius:12px;padding:12px 14px\"><b>Sınav:<\u002Fb> ortalama 60, SS 5 → 60 ± 5 = <b>55–65 puan<\u002Fb>. Öğrencilerin ≈ %68'i bu aralıkta; ≈ %16'sı 65'in üstünde, ≈ %16'sı 55'in altında.<\u002Fdiv>\n        <div style=\"background:#F5EFE3;border-radius:12px;padding:12px 14px\"><b>Boy (kurgu):<\u002Fb> ortalama 170 cm, SS 7 cm → ± 2 SS = <b>156–184 cm<\u002Fb>. Kişilerin ≈ %95'i bu aralıkta. 184 cm'den uzun olan: 100 kişide yalnızca 2–3 kişi.<\u002Fdiv>\n        <div style=\"background:#F5EFE3;border-radius:12px;padding:12px 14px\"><b>Tansiyon (100 hasta):<\u002Fb> 130,3 ± 17,7 = <b>112,7–148,0 mmHg<\u002Fb>. Kural ≈ 68 hasta der, gerçekte 67 hasta.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#1E2740;color:#F5EFE3;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-size:22px;font-weight:700\">Simetrik = normal mi?<\u002Fdiv>\n      <p style=\"margin:0;font-size:19px;line-height:1.6;color:#E7E1D4;text-wrap:pretty\"><b style=\"color:#FFFFFF\">Normal dağılım<\u002Fb>, özel bir simetrik çan eğrisidir. %68 – %95 – %99,7 kuralı tam olarak normal dağılım için geçerlidir.<\u002Fp>\n      <p style=\"margin:0;font-size:19px;line-height:1.6;color:#E7E1D4;text-wrap:pretty\">Ama her simetrik dağılım normal değildir. Zar at: 1'den 6'ya her sayı eşit sıklıkta gelir. Histogram simetriktir ama <b style=\"color:#FFFFFF\">düzdür<\u002Fb>, çan değildir.<\u002Fp>\n      <p style=\"margin:0;font-size:19px;line-height:1.6;color:#E7E1D4;text-wrap:pretty\">Tansiyon, boy, kilo gibi verilerin histogramı çana benzer; bunlara <b style=\"color:#FFFFFF\">\"yaklaşık normal\"<\u002Fb> deriz.<\u002Fp>\n      <div style=\"background:#2B3553;border-radius:12px;padding:12px 14px;font-size:18px;line-height:1.55;text-wrap:pretty\"><b style=\"color:#C9B6EE\">Parametrik / parametrik olmayan?<\u002Fb> Bu yöntemler ileride iki grubu karşılaştırırken gelecek. Bugünkü seçim onun ilk adımı: veri normale yakınsa ortalama ± SS, çarpıksa ortanca (Ç1–Ç3).<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border:2px dashed #6B4FA0;border-radius:18px;padding:20px 22px;font-size:19px;line-height:1.6;text-wrap:pretty\"><b style=\"color:#6B4FA0\">Köprü:<\u002Fb> |z| &gt; 2 olan değerler yaklaşık 20'de 1 görülür. Bu \"20'de 1\" fikrini ileride, iki grup arasındaki farkın tesadüf olup olmadığını konuşurken yeniden kullanacağız.<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ pg.p6 }}\" hint-placeholder-val=\"{{ true }}\">\n<section id=\"s5\" data-screen-label=\"06 Uç değer\" style=\"display:flex;flex-direction:column;gap:24px;scroll-margin-top:16px\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#E0603A;font-weight:700\">06<\u002Fspan>\n    <h2 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(30px,4vw,46px);margin:0;line-height:1.1\">Uç değer mi, hata mı?<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px\">\n    <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;letter-spacing:.08em;color:#E0603A\">KURAL 1 · z KURALI<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700\">|z| &gt; 3 → uç değer<\u002Fdiv>\n      <p style=\"margin:0;font-size:18px;line-height:1.55;text-wrap:pretty\">Ortalama ve SS'ye dayanır. <b>Simetrik<\u002Fb> veride iyi çalışır.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;letter-spacing:.08em;color:#0E6E65\">KURAL 2 · ÇEYREK KURALI<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:clamp(18px,2.4vw,22px);font-weight:700;line-height:1.5\">Ç3 + 1,5 × ÇAA üstü<br>ya da Ç1 − 1,5 × ÇAA altı → uç değer<\u002Fdiv>\n      <p style=\"margin:0;font-size:18px;line-height:1.55;text-wrap:pretty\">Çeyrekler uç değerden etkilenmez. <b>Çarpık<\u002Fb> veride güvenilir. Kutu grafiğinin bıyıkları bu sınırlarla çizilir:<\u002Fp>\n      <svg sc-camel-view-box=\"0 0 400 96\" style=\"width:100%;height:auto;display:block\">{{ boxEls }}<\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:32px;margin:12px 0 0;line-height:1.15\">Önce küçük bir örnek: 9 hasta<\u002Fh3>\n  <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n    <button sc-camel-on-click=\"{{ dmo.mini9 }}\" style=\"align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;background:#EFE6D3;color:#5A4A2E;padding:6px 12px;border-radius:8px;border:none;cursor:pointer;text-align:left\" style-hover=\"background:#E6DAC2\">Kurgusal örnek — 9 hastanın bekleme süresi (dk) · Verileri gör ▸<\u002Fbutton>\n    <p style=\"margin:0;font-size:19px;line-height:1.6;text-wrap:pretty\">Hatırla (Bölüm 6): <b>Ç1<\u002Fb> hastaların dörtte birinin, <b>Ç3<\u002Fb> dörtte üçünün altında kaldığı nokta. 9 değerde Ç1 = 3. değer, ortanca = 5. değer, Ç3 = 7. değer. <a href=\"bolum-06-ceyrekler.html\">Çeyrekleri tekrar et →<\u002Fa><\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px\">\n      <sc-for list=\"{{ mini.chips }}\" as=\"c\" hint-placeholder-count=\"9\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:4px\">\n          <span style=\"font-size:14px;color:#6B6457\">{{ c.pos }}<\u002Fspan>\n          <span style=\"width:100%;box-sizing:border-box;text-align:center;font-family:'JetBrains Mono',monospace;font-size:clamp(15px,2.4vw,22px);font-weight:700;padding:8px 0;border-radius:10px;border:1.5px solid #1E2740;background:{{ c.bg }};color:{{ c.color }}\">{{ c.t }}<\u002Fspan>\n          <span style=\"font-size:13px;font-weight:700;color:#0E5049;min-height:18px\">{{ c.tag }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <svg sc-camel-view-box=\"0 0 760 175\" style=\"width:100%;height:auto;display:block\">{{ mini.els }}<\u002Fsvg>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px\">\n      <div style=\"border:2px solid #12857A;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px\">\n        <b style=\"font-size:19px;color:#0E6E65\">Çeyrek kuralı<\u002Fb>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:17px;line-height:1.7\">Ç1 = 10 · Ç3 = 22<br>ÇAA = 22 − 10 = 12 dk<br>üst sınır = 22 + 1,5 × 12 = 22 + 18 = <b>40 dk<\u002Fb><\u002Fdiv>\n        <b style=\"font-size:18px;color:#0E6E65\">95 &gt; 40 → 95 dk uç değer ✓<\u002Fb>\n      <\u002Fdiv>\n      <div style=\"border:2px solid #E0603A;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px\">\n        <b style=\"font-size:19px;color:#C24A26\">z kuralı<\u002Fb>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:17px;line-height:1.7\">ortalama = 215 ÷ 9 = {{ mini.mean }} dk<br>SS = {{ mini.sd }} dk<br>{{ mini.mean }} + 3 × {{ mini.sd }} ≈ <b>{{ mini.zl }} dk<\u002Fb><\u002Fdiv>\n        <b style=\"font-size:18px;color:#C24A26\">95 &lt; {{ mini.zl }} → yakalanamadı ✗ (z = {{ mini.z95 }})<\u002Fb>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:19px;line-height:1.6;text-wrap:pretty;background:#F5EFE3;border-radius:12px;padding:12px 14px\">95 dakika gözle bakınca açıkça sıra dışı. Ama 95'in kendisi ortalamayı {{ mini.mean }} dakikaya, SS'yi {{ mini.sd }} dakikaya şişirdi; z sınırı {{ mini.zl }} dakikaya kaçtı. <b>Uç değer kendini saklar.<\u002Fb> Çeyrekler ise 95'ten hiç etkilenmedi: 95 yerine 50 yazsan da Ç1 ve Ç3 aynı kalır.<\u002Fp>\n  <\u002Fdiv>\n\n  <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:32px;margin:12px 0 0;line-height:1.15\">Aynı iş 100 hastada: bekleme süresi<\u002Fh3>\n  <p style=\"font-size:19px;line-height:1.6;max-width:780px;margin:0;color:#3A4258;text-wrap:pretty\"><b>Neden bu örnek?<\u002Fb> Hastane yönetimi soruyor: \"Hangi hastalar aşırı uzun bekledi? Onların dosyalarını tek tek inceleyelim.\" 100 hastanın bekleme süresi sağa çarpık. İki kuralı uygulayıp hangisinin doğru listeyi verdiğini göreceğiz. Küçük örnekteki durumun aynısı burada da olacak.<\u002Fp>\n  <div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start\">\n    <div style=\"flex:1.5 1 460px;min-width:0;background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px\">\n      <button sc-camel-on-click=\"{{ dmo.out }}\" style=\"align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;background:#EFE6D3;color:#5A4A2E;padding:6px 12px;border-radius:8px;border:none;cursor:pointer;text-align:left\" style-hover=\"background:#E6DAC2\">Dummy (kurgusal) veriler — 100 hasta · Verileri gör ▸<\u002Fbutton>\n      <svg sc-camel-view-box=\"0 0 760 250\" style=\"width:100%;height:auto;display:block\">{{ out.els }}<\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:#6B6457\">Adım {{ out.stepNo }} / 5<\u002Fdiv>\n      <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:30px;margin:0;line-height:1.15\">{{ out.title }}<\u002Fh3>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:20px;background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:12px;padding:14px;line-height:1.8\">{{ out.calc1 }}<br><b style=\"color:{{ out.color }}\">{{ out.calc2 }}<\u002Fb><\u002Fdiv>\n      <p style=\"margin:0;font-size:19px;line-height:1.6;text-wrap:pretty\">{{ out.text }}<\u002Fp>\n      <div style=\"display:flex;gap:10px\">\n        <button sc-camel-on-click=\"{{ out.prev }}\" style=\"font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid #1E2740;background:transparent;color:#1E2740;opacity:{{ out.prevOp }}\">← Geri<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ out.next }}\" style=\"font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid #1E2740;background:#1E2740;color:#F5EFE3;opacity:{{ out.nextOp }}\">İleri →<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ out.restart }}\" style=\"font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid #1E2740;background:transparent;color:#1E2740\">↺ Baştan<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:#1E2740;color:#F5EFE3;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"font-size:21px;font-weight:700;line-height:1.45\">Çeyrek kuralı 7 hasta buldu, z kuralı yalnızca 4. Neden farklı?<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n      <sc-for list=\"{{ why.opts }}\" as=\"o\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.color }};text-align:left\">{{ o.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ why.done }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"margin:0;font-size:19px;line-height:1.6;color:#E7E1D4;text-wrap:pretty\"><b style=\"color:{{ why.tagColor }}\">{{ why.tag }}<\u002Fb> 185 ve 210 dakikalık uç değerler ortalamayı ve SS'yi büyütür (SS 37,4 dk; ortalamadan bile büyük!). SS büyüyünce \"ortalama + 3 SS\" sınırı 149 dakikaya kaçar ve uç değerlerin bir kısmı sınırın altında kalır. Uç değer kendini saklar. Çeyrekler ise uç değerlerden etkilenmez.<\u002Fp>\n        <button sc-camel-on-click=\"{{ why.restart }}\" style=\"align-self:flex-start;font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid #F5EFE3;background:transparent;color:#F5EFE3\">↺ Soruyu baştan sor<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px\">\n    <div style=\"background:#FFFBF3;border:2px solid #12857A;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700\">Bekleme: 210 dk<\u002Fdiv>\n      <div style=\"font-size:19px;font-weight:700;color:#0E6E65\">Olağan dışı ama MÜMKÜN<\u002Fdiv>\n      <p style=\"margin:0;font-size:18px;line-height:1.55\">Gerçek uç değer. <b>Silinmez<\u002Fb>; raporda belirtilir.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#FFFBF3;border:2px solid #C24A26;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700\">Yaş: 210 yıl<\u002Fdiv>\n      <div style=\"font-size:19px;font-weight:700;color:#C24A26\">MÜMKÜN DEĞİL<\u002Fdiv>\n      <p style=\"margin:0;font-size:18px;line-height:1.55\">Veri giriş hatası. <b>Kaynaktan düzeltilir<\u002Fb> (hasta dosyasına bakılır).<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:#6B4FA0;color:#FFFFFF;border-radius:18px;padding:22px 24px;font-family:'DM Serif Display',serif;font-size:clamp(26px,3.4vw,38px);line-height:1.2;text-align:center\">Sorulacak tek soru: \"Bu değer gerçekte olabilir mi?\"<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ pg.p7 }}\" hint-placeholder-val=\"{{ true }}\">\n<section id=\"s6\" data-screen-label=\"07 Rapor okuma\" style=\"display:flex;flex-direction:column;gap:24px;scroll-margin-top:16px\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#E0603A;font-weight:700\">07<\u002Fspan>\n    <h2 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(30px,4vw,46px);margin:0;line-height:1.1\">Rapor okuma: üç hatayı bul<\u002Fh2>\n  <\u002Fdiv>\n  <p style=\"font-size:19px;line-height:1.6;max-width:780px;margin:0;color:#3A4258;text-wrap:pretty\">Aşağıda kurgusal bir hastane bülteni var. Hatalı olduğunu düşündüğün <b>cümleye dokun<\u002Fb>.<\u002Fp>\n  <div style=\"background:#FFFFFF;border:1.5px solid #D9CFBC;border-radius:18px;padding:clamp(18px,3vw,32px);display:flex;flex-direction:column;gap:16px;box-shadow:0 2px 0 #D9CFBC\">\n    <div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline;border-bottom:2px solid #1E2740;padding-bottom:10px\">\n      <div style=\"font-family:'DM Serif Display',serif;font-size:28px\">Hastane Bülteni<\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:#6B4FA0\">Bulunan: {{ bul.count }} / 3<\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:clamp(19px,2.2vw,23px);line-height:1.9\">\n      <sc-for list=\"{{ bul.segs }}\" as=\"g\" hint-placeholder-count=\"5\">\n        <span sc-camel-on-click=\"{{ g.onClick }}\" style=\"cursor:pointer;padding:2px 3px;border-radius:5px;background:{{ g.bg }};box-decoration-break:clone;-webkit-box-decoration-break:clone\">{{ g.t }} <\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fp>\n    <sc-if value=\"{{ bul.okMsg }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size:18px;color:#3A4258\">Bu cümlede bir sorun yok. Başka bir cümleye bak.<\u002Fdiv>\n    <\u002Fsc-if>\n    <button sc-camel-on-click=\"{{ bul.reset }}\" style=\"align-self:flex-start;font:inherit;font-size:17px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer;border:2px solid #1E2740;background:transparent;color:#1E2740\">↺ Baştan başla<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:14px\">\n    <sc-for list=\"{{ bul.found }}\" as=\"f\" hint-placeholder-count=\"0\">\n      <div style=\"background:#1E2740;color:#F5EFE3;border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-size:21px;font-weight:700\"><span style=\"color:#F4A48A\">{{ f.n }}<\u002Fspan> {{ f.title }}<\u002Fdiv>\n        <p style=\"margin:0;font-size:19px;line-height:1.6;color:#E7E1D4;text-wrap:pretty\">{{ f.why }}<\u002Fp>\n        <div style=\"background:#7FD8CB;color:#1E2740;border-radius:12px;padding:12px 16px;font-size:19px;line-height:1.5\"><b>Düzeltilmiş:<\u002Fb> {{ f.fix }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"font-size:22px;font-weight:700\">Karar ağacı: sayısal bir değişkeni nasıl yazarım?<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;align-items:stretch\">\n      <div style=\"background:#1E2740;color:#F5EFE3;border-radius:14px;padding:16px;font-size:19px;font-weight:700;display:flex;align-items:center\">1 · Sayısal değişken<\u002Fdiv>\n      <div style=\"background:#E4DAF5;border-radius:14px;padding:16px;font-size:19px;font-weight:700;display:flex;align-items:center\">2 · Biçimine bak (histogram, çarpıklık)<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"background:#FFFFFF;border:2px solid #12857A;border-radius:14px;padding:12px 14px;font-size:18px\"><b>Simetrik<\u002Fb> → ortalama ± SS<\u002Fdiv>\n        <div style=\"background:#FFFFFF;border:2px solid #E0603A;border-radius:14px;padding:12px 14px;font-size:18px\"><b>Çarpık<\u002Fb> → ortanca (Ç1–Ç3)<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#6B4FA0;color:#FFFFFF;border-radius:14px;padding:16px;font-size:19px;font-weight:700;display:flex;align-items:center\">3 · Birimi ve paydayı (n) yaz<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ pg.p8 }}\" hint-placeholder-val=\"{{ true }}\">\n<section id=\"s7\" data-screen-label=\"08 Kendini dene\" style=\"display:flex;flex-direction:column;gap:24px;scroll-margin-top:16px\">\n  <div style=\"display:flex;align-items:baseline;gap:16px;flex-wrap:wrap\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:#E0603A;font-weight:700\">08<\u002Fspan>\n    <h2 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(30px,4vw,46px);margin:0;line-height:1.1\">Kendini dene<\u002Fh2>\n    <div style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;background:#1E2740;color:#F5EFE3;padding:8px 16px;border-radius:999px\">Puan: {{ quiz.score }} / 7<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px;align-items:start\">\n    <sc-for list=\"{{ quiz.items }}\" as=\"q\" hint-placeholder-count=\"7\">\n      <div style=\"background:#FFFBF3;border:1.5px solid #D9CFBC;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:20px;font-weight:700;line-height:1.4;text-wrap:pretty\"><span style=\"font-family:'JetBrains Mono',monospace;color:#E0603A\">{{ q.n }}<\u002Fspan> {{ q.q }}<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ q.opts }}\" as=\"o\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"font:inherit;font-size:18px;font-weight:500;padding:10px 14px;border-radius:12px;cursor:pointer;border:2px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.color }};text-align:left\">{{ o.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ q.done }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:0;font-size:18px;line-height:1.55;text-wrap:pretty;background:#F5EFE3;border-radius:12px;padding:12px 14px\"><b style=\"color:{{ q.tagColor }}\">{{ q.tag }}<\u002Fb> {{ q.e }}<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <button sc-camel-on-click=\"{{ quiz.reset }}\" style=\"align-self:flex-start;font:in
